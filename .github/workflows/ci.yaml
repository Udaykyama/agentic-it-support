name: Test, build, and publish

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: neuraldesk_test
          POSTGRES_PASSWORD: ci-only-owner-password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d neuraldesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Bootstrap least-privileged integration database
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: neuraldesk_test
          PGHOST: 127.0.0.1
          PGPORT: ${{ job.services.postgres.ports[5432] }}
          PGPASSWORD: ci-only-owner-password
        run: |
          set -euo pipefail
          APP_DB_PASSWORD="$(.venv/bin/python -c 'import secrets; print(secrets.token_hex(32))')"
          printf '::add-mask::%s\n' "$APP_DB_PASSWORD"
          export APP_DB_PASSWORD
          sh docker/postgres/init-runtime-role.sh
          export MIGRATION_DATABASE_URL="postgresql+psycopg://postgres:${PGPASSWORD}@${PGHOST}:${PGPORT}/${POSTGRES_DB}"
          .venv/bin/python -m alembic upgrade head
          printf 'TEST_DATABASE_URL=postgresql+psycopg://neuraldesk_app:%s@%s:%s/%s\n' \
            "$APP_DB_PASSWORD" "$PGHOST" "$PGPORT" "$POSTGRES_DB" >> "$GITHUB_ENV"
      - name: Run unit and PostgreSQL/Redis integration tests
        env:
          TEST_REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports[6379] }}/15
        run: .venv/bin/python -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.3.0
      - name: Validate Compose configuration and shell syntax
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --project-name runbooksignal-demo --env-file demo/demo.env \
            -f compose.yaml -f demo/compose.demo.yaml config --quiet
          for script in docker/*-entrypoint.sh docker/postgres/*.sh demo/*.sh; do
            sh -n "$script"
          done
      - name: Build deployable image without publishing
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: neuraldesk:ci
          cache-from: type=gha,scope=neuraldesk
          cache-to: type=gha,mode=max,scope=neuraldesk
      - name: Check non-root, read-only image and import-time safety
        run: |
          docker run --rm --read-only \
            --tmpfs /run/neuraldesk:mode=0700,uid=10001,gid=10001 \
            --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint python neuraldesk:ci -c '
          import os
          from pathlib import Path
          import api
          import app.worker
          assert os.getuid() == 10001
          assert callable(api.create_app)
          for name in (".env", "tickets.db", "chroma_db", "data", "demo", "demo.py"):
              assert not (Path("/app") / name).exists(), name
          '
      - name: Generate isolated Compose smoke-test credentials
        run: |
          python3 - <<'PY'
          import os
          import secrets
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("NEURALDESK_IMAGE=neuraldesk:ci\n")
              for name in ("POSTGRES_PASSWORD", "APP_DB_PASSWORD", "REDIS_PASSWORD", "SECRET_KEY", "METRICS_TOKEN"):
                  value = secrets.token_hex(32)
                  print(f"::add-mask::{value}")
                  output.write(f"{name}={value}\n")
          PY
      - name: Exercise migrations, health checks, gateway, and replica scaling
        run: |
          set -euo pipefail
          docker compose --env-file .env.example up --detach --no-build \
            --wait --wait-timeout 180 --scale api=2 --scale worker=2
          docker compose --env-file .env.example exec -T gateway \
            nginx -c /run/nginx/nginx.conf -t
          curl --fail --silent --show-error http://localhost:8000/health/ready
          curl --fail --silent --show-error --output /dev/null http://localhost:8000/api/v1/openapi.json
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            http://localhost:8000/api/v1/me)" = "401"
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            http://localhost:8000/metrics)" = "401"
          curl --fail --silent --show-error --output /dev/null \
            -H "Authorization: Bearer ${METRICS_TOKEN}" http://localhost:8000/metrics
          docker compose --env-file .env.example up --detach --no-build \
            --wait --wait-timeout 180 --scale api=1 --scale worker=1
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 1 \
            http://localhost:8000/health/ready
      - name: Show diagnostic logs on failure
        if: failure()
        run: docker compose --env-file .env.example logs --no-color --tail 100
      - name: Remove isolated CI containers and volumes
        if: always()
        run: docker compose --env-file .env.example down --volumes --remove-orphans

  demo:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Start the supported synthetic demo
        run: ./demo/run-demo.sh
      - name: Exercise the guarded worker-draining reset
        run: ./demo/run-demo.sh reset
      - name: Verify pinned identity image and loopback publications
        run: |
          set -euo pipefail
          keycloak_image='quay.io/keycloak/keycloak:26.7.3@sha256:ff4257d0d64efbe99ed1ddfaf07765cc3c36dc7518bf8324d41961327f441c54'
          docker image inspect "$keycloak_image" >/dev/null
          python3 - <<'PY'
          import json
          import subprocess

          compose = [
              "docker", "compose",
              "--project-name", "runbooksignal-demo",
              "--env-file", "demo/demo.env",
              "-f", "compose.yaml",
              "-f", "demo/compose.demo.yaml",
          ]

          def bindings(service):
              container = subprocess.check_output(
                  [*compose, "ps", "--quiet", service], text=True
              ).strip()
              assert container, f"{service} has no running container"
              details = json.loads(
                  subprocess.check_output(["docker", "inspect", container], text=True)
              )[0]
              return details["HostConfig"]["PortBindings"] or {}

          assert bindings("gateway") == {
              "8080/tcp": [{"HostIp": "127.0.0.1", "HostPort": "8000"}]
          }
          assert bindings("keycloak") == {
              "8080/tcp": [{"HostIp": "127.0.0.1", "HostPort": "8081"}]
          }
          for service in ("model-stub", "db", "redis"):
              assert not {port: value for port, value in bindings(service).items() if value}, service
          PY
      - name: Exercise browser OIDC and the complete reviewed-knowledge workflow
        run: python3 demo/smoke.py
      - name: Verify normal start preserves presenter progress
        run: |
          set -euo pipefail
          ./demo/run-demo.sh
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          specification = importlib.util.spec_from_file_location(
              "runbooksignal_demo_smoke", Path("demo/smoke.py")
          )
          smoke = importlib.util.module_from_spec(specification)
          specification.loader.exec_module(smoke)

          browser = smoke.Browser()
          browser.login(
              "northstar-admin", "northstar-demo", ["admin"],
              "admin@northstar.example.com",
          )
          _, runbooks = browser.call("/api/v1/runbooks?limit=100")
          assert any(
              item["subcategory"] == "vpn_timeout" and item["status"] == "approved"
              for item in runbooks["runbooks"]
          )
          _, tickets = browser.call("/api/v1/tickets?limit=100")
          assert any(
              item["title"] == "VPN retry demonstration" and item["status"] == "resolved"
              for item in tickets["tickets"]
          )
          PY
      - name: Show demo diagnostics on failure
        if: failure()
        run: |
          docker compose --project-name runbooksignal-demo --env-file demo/demo.env \
            -f compose.yaml -f demo/compose.demo.yaml logs --no-color --tail 150
      - name: Remove only demo containers and synthetic volumes
        if: always()
        run: |
          docker compose --project-name runbooksignal-demo --env-file demo/demo.env \
            -f compose.yaml -f demo/compose.demo.yaml down --volumes --remove-orphans

  publish:
    needs: [test, build, demo]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.3.0
      - name: Normalize GHCR image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6.2.0
        id: metadata
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest
      - name: Publish tested revision to GHCR
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=neuraldesk
          cache-to: type=gha,mode=max,scope=neuraldesk
